<style>
*{margin:0;box-sizing:border-box}
body{width:1584px;height:396px;overflow:hidden;font-family:Inter,sans-serif;color:#16161b;
 background:linear-gradient(100deg,#fff6f8 0%,#fcebee 45%,#f6d8de 100%);position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(30px)}
.g1{right:-120px;top:-170px;width:760px;height:700px;background:radial-gradient(closest-side,rgba(229,19,43,.30),rgba(229,19,43,.07) 60%,transparent)}
.g2{left:-160px;bottom:-260px;width:620px;height:520px;background:radial-gradient(closest-side,rgba(255,150,170,.35),transparent)}
.ring{position:absolute;right:60px;top:26px;width:344px;height:344px;border-radius:50%;border:1.5px solid rgba(229,19,43,.28);box-shadow:0 0 90px rgba(229,19,43,.18),inset 0 0 60px rgba(229,19,43,.10)}
.ring2{right:15px;top:-20px;width:434px;height:434px;border-color:rgba(229,19,43,.12);box-shadow:none}
.streak{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(229,19,43,.55),transparent)}
.txt{position:absolute;right:542px;top:0;align-items:center;text-align:center;height:396px;display:flex;flex-direction:column;justify-content:center;padding-bottom:6px}
h1{font-family:'Bebas Neue';font-weight:400;font-size:190px;line-height:.82;letter-spacing:.02em;color:#16161b}
.tag{margin-top:6px;font-weight:700;font-size:30px;letter-spacing:.42em;margin-right:-.42em;color:#e5132b}
.meta{justify-content:center;margin-top:22px;font-size:23px;font-weight:500;color:#50505a;display:flex;gap:12px;align-items:center}
.meta i{width:4px;height:4px;border-radius:50%;background:#767680}
.role{margin-top:14px;font-size:16px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#16161b}
.pills{position:absolute;left:60px;top:70px;display:grid;grid-template-columns:repeat(2,auto);gap:14px;justify-content:start}
.pills span{background:rgba(255,255,255,.8);border:1px solid rgba(229,19,43,.2);border-radius:999px;padding:14px 30px;font-weight:700;font-size:20px;letter-spacing:.14em;color:#e5132b;text-align:center}
.spark{position:absolute;left:0;top:0}
.tools{margin-top:18px;display:flex;gap:8px;justify-content:center}.tools span{border:1.5px solid rgba(229,19,43,.35);border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px;letter-spacing:.12em;color:#e5132b;background:rgba(255,255,255,.6)}
.quote{position:absolute;left:70px;top:70px;width:560px}
.quote small{display:flex;align-items:center;gap:14px;font-weight:700;font-size:12px;letter-spacing:.4em;color:#e5132b}
.quote small:after{content:"";width:90px;height:2px;background:linear-gradient(90deg,#e5132b,transparent)}
.quote p{margin-top:16px;font-family:'Instrument Serif',serif;font-style:italic;font-size:50px;line-height:1.08;color:#16161b}
.quote p em{color:#e5132b}
.chip{position:absolute;background:rgba(255,255,255,.82);border:1px solid rgba(229,19,43,.18);border-radius:14px;padding:13px 20px;box-shadow:0 10px 30px rgba(229,19,43,.12)}
.chip b{display:block;font-size:22px;font-weight:700;white-space:nowrap}
.chip span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#50505a;white-space:nowrap;margin-top:2px}
</style></head><body>
